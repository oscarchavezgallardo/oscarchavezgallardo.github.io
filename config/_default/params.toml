# -- Theme Options --
colorScheme = "blowfish"
defaultAppearance = "dark" 
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
replyByEmail = false
mainSections = ["docs", "posts"]

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false

# Estilos de fondo recuperados
defaultBackgroundImage = "img/wald.jpg" 
defaultFeaturedImage = "img/cover.png" 
defaultSocialImage = "/android-chrome-512x512.png" 

[header]
  layout = "fixed" 

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  # Mantiene tu fondo personalizado activo
  layout = "custom" 
  # Muestra tus artículos reales debajo del fondo
  showRecent = true 
  showRecentItems = 10
  # Crucial: Al estar en false, evitamos que se active el modo demo/banner azul
  showMoreLink = false 
  cardView = false
  layoutBackgroundBlur = true 

[article]
  showAuthor = true
  showHero = false
  heroStyle = "basic" 
  showTableOfContents = true

[list]
  # Configuración para el diseño de posts pequeños (imagen a la izquierda)
  showHero = false            
  heroStyle = "basic"
  showSummary = true          # Muestra el resumen al lado de la imagen
  showViews = true 
  showLikes = true 
  showCards = false           # Desactiva los cuadros grandes
  cardView = false            # Asegura la vista horizontal
  compact = true              # ESTA ES LA CLAVE: hace la lista pequeña y limpia
  showBreadcrumbs = false
  groupByYear = false
  constrainItemsWidth = true

[taxonomy]
  cardView = false

[term]
  cardView = false 

[buymeacoffee]
  identifier = "oscarchavezgallardo"
  globalWidget = true